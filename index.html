<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090605">
  <link rel="preload" as="image" href="./Heartwood.jpg">
  <title>LUX | AR Digital Samples</title>
  <meta name="apple-mobile-web-app-title" content="LUX AR Samples">
  <link rel="apple-touch-icon" href="./icon.png?v=1">
  <link rel="icon" type="image/png" href="./icon.png?v=1">
  <link rel="stylesheet" href="./styles.css?v=14">
  <link rel="stylesheet" href="./splash.css?v=11">
</head>
<body class="splash-visible">
  <div class="lux-splash" id="lux-splash" role="region" aria-label="West Coast Naturals AR introduction">
    <img class="lux-splash__image" src="./Heartwood.jpg" alt="" fetchpriority="high" draggable="false">
    <div class="lux-splash__grid-reveal" aria-hidden="true">
      <img class="lux-splash__image" src="./Heartwood-Grid.jpg" alt="" draggable="false">
    </div>
    <div class="lux-splash__reveal" aria-hidden="true"></div>
    <div class="lux-splash__shade" aria-hidden="true"></div>
    <button class="lux-splash__start" id="splash-start" type="button" aria-label="Start augmented reality">
      <span class="lux-splash__pulse-ring" aria-hidden="true"></span>
      <span class="lux-splash__circle" aria-hidden="true">
        <svg id="splash-triangle" class="lux-splash__triangle" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
          <path d="M24 11 Q24 2 34 8 L107 51 Q119 59 107 67 L34 111 Q24 117 24 105 Z"></path>
        </svg>
      </span>
      <span class="lux-splash__label" id="splash-label">START AR</span>
    </button>
    <img class="lux-splash__west" id="splash-west" src="./West Coast.png" alt="West Coast Natural Series" draggable="false">
    <img class="lux-splash__x" id="splash-x" src="./x.png" alt="LUX" draggable="false">
  </div>
  <main id="app">
    <div class="stage" id="stage">
      <canvas id="preview" aria-label="Interactive 3D preview of LUX cladding"></canvas>
      <canvas id="camerafeed" aria-label="Augmented reality camera" hidden></canvas>
      <div class="stage-vignette" aria-hidden="true"></div>
      <div class="crosshair" id="crosshair" aria-hidden="true"><span></span><span></span></div>
      <div id="handles" aria-label="Resize sample">
        <button class="edge-handle" data-edge="top" aria-label="Drag to adjust top edge"><svg class="resize-glyph" viewBox="0 0 80 48" aria-hidden="true" focusable="false"><path d="M5.3 21.2 L28.2 5.1 Q33 2.4 33 8 L33 40 Q33 45 28.2 42.9 L5.3 26.8 Q1 24 5.3 21.2Z"/><path d="M74.7 21.2 L51.8 5.1 Q47 2.4 47 8 L47 40 Q47 45 51.8 42.9 L74.7 26.8 Q79 24 74.7 21.2Z"/></svg></button>
        <button class="edge-handle" data-edge="right" aria-label="Drag to adjust right edge"><svg class="resize-glyph" viewBox="0 0 80 48" aria-hidden="true" focusable="false"><path d="M5.3 21.2 L28.2 5.1 Q33 2.4 33 8 L33 40 Q33 45 28.2 42.9 L5.3 26.8 Q1 24 5.3 21.2Z"/><path d="M74.7 21.2 L51.8 5.1 Q47 2.4 47 8 L47 40 Q47 45 51.8 42.9 L74.7 26.8 Q79 24 74.7 21.2Z"/></svg></button>
        <button class="edge-handle" data-edge="bottom" aria-label="Drag to adjust bottom edge"><svg class="resize-glyph" viewBox="0 0 80 48" aria-hidden="true" focusable="false"><path d="M5.3 21.2 L28.2 5.1 Q33 2.4 33 8 L33 40 Q33 45 28.2 42.9 L5.3 26.8 Q1 24 5.3 21.2Z"/><path d="M74.7 21.2 L51.8 5.1 Q47 2.4 47 8 L47 40 Q47 45 51.8 42.9 L74.7 26.8 Q79 24 74.7 21.2Z"/></svg></button>
        <button class="edge-handle" data-edge="left" aria-label="Drag to adjust left edge"><svg class="resize-glyph" viewBox="0 0 80 48" aria-hidden="true" focusable="false"><path d="M5.3 21.2 L28.2 5.1 Q33 2.4 33 8 L33 40 Q33 45 28.2 42.9 L5.3 26.8 Q1 24 5.3 21.2Z"/><path d="M74.7 21.2 L51.8 5.1 Q47 2.4 47 8 L47 40 Q47 45 51.8 42.9 L74.7 26.8 Q79 24 74.7 21.2Z"/></svg></button>
      </div>
      <header class="topbar">
        <div class="brand"><img class="brand-image" src="./LUX%20Logo%20white.png" alt="LUX Architectural Products"></div>
        <span class="top-tag">DIGITAL SAMPLES <span class="top-dot"></span> <span id="mode-label">3D PREVIEW</span></span>
      </header>
      <div class="status-pill" id="status" role="status" aria-live="polite">Rotate the 3D view by dragging. Resize using the four handles.</div>
      <div class="stage-bottom-actions">
        <button id="start-ar" class="primary-button">START AR <span class="button-icon">↗</span></button>
        <button id="reposition" class="outline-button" hidden>REPOSITION</button>
        <button id="customize" class="primary-button" hidden>FINISHES</button>
      </div>
    </div>
    <section class="config-panel" aria-label="Customize LUX digital sample">
      <button id="close-panel" class="panel-close-button" type="button" hidden aria-label="Close finish selector">×</button>
      <div class="panel-top">
        <div><span class="eyebrow">LUX COLLECTION</span><h1>Find your finish.</h1></div>
        <div class="dimensions" id="dimensions">1.60 × 1.10 m</div>
      </div>
      <div class="section-heading"><h2>Profile</h2><span id="profile-count">01 / 05</span></div>
      <div class="profile-row" id="profiles"></div>
      <div class="section-heading finish-heading"><h2>Woodgrain finish</h2><span id="finish-label">CHARWOOD</span></div>
      <div class="finish-row" id="finishes"></div>
      <footer class="footer-line">
        <span>Real LUX profiles • visualization prototype</span>
        <a href="https://luxarpro.com/" target="_blank" rel="noopener">LUXARPRO.COM ↗</a>
      </footer>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="./wall-guide.js?v=5" defer></script>
  <script src="./floor-wall-test.js?v=2" defer></script>
  <script src="./diagnostics.js?v=3" defer></script>
  <script src="./app.js?v=13" defer></script>
  <script src="./splash.js?v=4" defer></script>

       https://github.com/8thwall/engine/blob/main/LICENSE -->
</body>
</html>
