name: Build LUX Quick Look real profile prototypes
on:
  push:
    branches:
      - main
    paths:
      - 'tools/build_quicklook_profile.py'
      - '.github/workflows/build-quicklook-profile.yml'
      - 'Profiles/V-GRROOVE_LAP.glb'
      - 'Textures/Heartwood/LAP HEARTWOOD.jpg'
      - 'Textures/Heartwood/TRIM HEARTWOOD.jpg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'trimesh>=4,<5' numpy usd-core
      - name: Convert original V-Groove/Lap to real USDZ
        run: python tools/build_quicklook_profile.py
      - name: Parse USDZ in OpenUSD and verify independent handles
        run: |
          python - <<'PY'
          from pxr import Usd
          for filename in ('quicklook/lux-real-lap-wall.usdz','quicklook/lux-real-lap-resize.usdz'):
              stage=Usd.Stage.Open(filename)
              assert stage, filename
              assert stage.GetDefaultPrim().GetName()=='LUXRealLap'
              assert stage.GetPrimAtPath('/LUXRealLap/Sample/Core').IsValid()
              assert stage.GetPrimAtPath('/LUXRealLap/Sample/BandLeft/Face').IsValid()
              if 'resize' in filename:
                  for side in ('Left','Right','Top','Bottom'):
                      assert stage.GetPrimAtPath('/Expand'+side).IsValid(), side
                      assert stage.GetPrimAtPath('/LUXRealLap/Controls/Handle'+side).IsValid(), side
              print('OpenUSD validation passed',filename)
          PY
      - name: Commit generated USDZ assets for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quicklook/lux-real-lap-wall.usdz quicklook/lux-real-lap-resize.usdz
          if ! git diff --cached --quiet; then
            git commit -m "Generate real-profile wall and four-handle Quick Look models"
            git push origin HEAD:main
          fi
