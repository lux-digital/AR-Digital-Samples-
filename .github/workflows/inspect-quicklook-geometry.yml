name: Inspect LUX Quick Look GLB geometry
on:
  push:
    branches: [quicklook-real-lap-profile-20261126]
    paths:
      - '.github/workflows/inspect-quicklook-geometry.yml'
      - 'tools/build_quicklook_profile.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'trimesh>=4,<5' numpy
      - name: Show GLB bounds and UVs
        run: |
          python - <<'PY'
          import trimesh,numpy as np
          for name in ['V-GRROOVE_LAP','RANDOM PLANK','BOARD+BATTEN']:
              path = 'Profiles/'+name+'.glb'
              scene=trimesh.load(path,force='scene')
              print('\n===',path,'scene',scene.bounds,'nodes',len(scene.graph.nodes_geometry),'===')
              for node in list(scene.graph.nodes_geometry)[:16]:
                  transform,geom=scene.graph[node]
                  mesh=scene.geometry[geom]
                  uv=getattr(mesh.visual,'uv',None)
                  pts=trimesh.transform_points(mesh.vertices,transform)
                  print('node=',node,'mesh=',geom,'vertices=',len(mesh.vertices),'faces=',len(mesh.faces),'rawBounds=',mesh.bounds.tolist(),'worldBounds=',pts.min(axis=0).tolist(),pts.max(axis=0).tolist(), 'uv=',None if uv is None else [np.min(uv,axis=0).tolist(),np.max(uv,axis=0).tolist()])
          PY
